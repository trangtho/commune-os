routes:
  - id: 1
    name: communeos-api
    uri: /api/*
    plugins:
      cors:
        allow_origins: "http://localhost:3000"
        allow_methods: "GET,POST,PATCH,OPTIONS"
        allow_headers: "Authorization,Content-Type"
        max_age: 3600
    upstream:
      type: roundrobin
      nodes:
        "orchestrator:8000": 1
  - id: 2
    name: communeos-health
    uris:
      - /health
      - /docs
      - /openapi.json
    plugins:
      cors:
        allow_origins: "http://localhost:3000"
        allow_methods: "GET,OPTIONS"
    upstream:
      type: roundrobin
      nodes:
        "orchestrator:8000": 1
#END
