# Kiểm tra tự động trên mỗi Pull Request và mỗi lần đưa mã vào main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  giay-phep:
    name: Giấy phép (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mọi tệp đều có thông tin giấy phép
        run: |
          pipx install reuse
          reuse lint

  kiem-thu:
    name: Dựng từ mã nguồn và kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Tạo .env từ mẫu
        run: |
          cp .env.example .env
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env
          # Mật khẩu quản trị hệ thống: make check-env từ chối mật khẩu mẫu.
          sed -i "s/^COMMUNEOS_ADMIN_PASSWORD=.*/COMMUNEOS_ADMIN_PASSWORD=Ci$(openssl rand -hex 12)/" .env
          make check-env

      - name: Kiểm tra cú pháp docker-compose và script
        run: |
          docker compose config -q
          sh -n core/tests/tenant-isolation.sh
          sh -n core/identity/check-admin-env.sh
          node --check core/demo/demo.mjs
          node --check core/accounts/server.mjs
          sh -n core/db/init/00-create-app-role.sh
          sh -n core/db/init/02-create-api-roles.sh

      - name: Dựng và khởi động các dịch vụ lõi
        run: docker compose up -d --build db identity identity-setup db-setup rest-keys rest gateway workflow-engine orchestrator storage files accounts

      - name: Chờ Keycloak và cổng API sẵn sàng
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9080/rest/dossiers || true)
            kc=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/realms/communeos/.well-known/openid-configuration || true)
            wf=$(docker compose logs orchestrator 2>/dev/null | grep -c "Dịch vụ điều phối chạy" || true)
            # identity-setup tạo tài khoản quản trị hệ thống từ .env rồi dừng.
            setup=$(docker compose ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}' identity-setup 2>/dev/null || true)
            if [ "$code" = "401" ] && [ "$kc" = "200" ] && [ "$wf" != "0" ] && [ "$setup" = "identity-setup exited 0" ]; then echo "Sẵn sàng sau $i lần thử"; exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=40
          exit 1

      - name: Tạo dữ liệu mẫu qua API của lõi (xã, lãnh đạo, cán bộ, công dân, hồ sơ)
        run: make demo

      - name: Kiểm thử cách ly xã, xử lý hồ sơ, sổ ghi nhận, khởi tạo tài khoản
        run: make test

      - name: Kiểm thử API luồng chính của công dân trong lõi (ROLLBACK)
        run: make citizen-api-test

      - name: Kiểm thử Kênh người dân
        run: make test-citizen

      - name: In log khi lỗi
        if: failure()
        run: |
          echo '=== Trang thai tat ca containers ==='
          docker compose ps -a || true
          echo '=== PostgreSQL va db-setup ==='
          docker compose logs --no-color --tail=200 db db-setup || true
          echo '=== Cac dich vu loi con lai ==='
          docker compose logs --no-color --tail=60 identity rest gateway workflow-engine orchestrator || true
