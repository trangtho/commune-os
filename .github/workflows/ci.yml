# Kiểm tra tự động trên mỗi Pull Request và mỗi lần đưa mã vào main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  giay-phep:
    name: Giấy phép (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mọi tệp đều có thông tin giấy phép
        run: |
          pipx install reuse
          reuse lint

  # Lõi cài và chạy khi KHÔNG có gói nghiệp vụ nào, rồi mới cài thêm gói doanh nghiệp (không bao giờ có gói xã):
  # đúng cách một tổ chức dùng lõi: dựng lõi trước, nạp gói nghiệp vụ của mình sau.
  chi-loi:
    name: Chỉ lõi, không có gói xã
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Cài như máy chủ: bật proxy HTTPS, make secrets tạo .env và sinh mọi bí mật; make check-env phải đạt.
      - name: Tạo .env như máy chủ (make secrets, bật HTTPS), chưa có gói nào
        run: |
          cp .env.example .env
          sed -i 's/^#COMPOSE_PROFILES=https/COMPOSE_PROFILES=https/' .env
          sed -i "s/^COMMUNEOS_MODULES=.*/COMMUNEOS_MODULES=/" .env
          make secrets
          make check-env

      - name: Dựng lõi, bảng quản trị nền tảng và proxy HTTPS (không gói nghiệp vụ, không ứng dụng của gói xã)
        run: >-
          docker compose up -d --build
          db db-setup identity identity-setup rest-keys rest gateway api-docs workflow-engine orchestrator
          storage files accounts admin https

      - name: Chờ mọi dịch vụ sẵn sàng (healthcheck)
        run: sh core/tests/wait-ready.sh 600

      - name: Lõi trống chạy được, không có bảng, API nào của gói xã
        run: |
          make test-platform
          test "$(curl -s http://localhost:9080/docs/modules.json)" = "[]"
          curl -fsS http://localhost:3001/api/health

      - name: Cài thêm gói doanh nghiệp vào lõi đang chạy
        run: |
          sed -i "s/^COMMUNEOS_MODULES=.*/COMMUNEOS_MODULES=doanh-nghiep/" .env
          docker compose up -d \
            db db-setup identity identity-setup rest-keys rest gateway api-docs workflow-engine orchestrator \
            storage files accounts admin https
          sh core/tests/wait-ready.sh 600

      - name: Lõi dùng chung, và không có bảng, API nào của gói xã
        run: make test-platform

      - name: Gói doanh nghiệp chạy trên lõi không có gói xã
        run: make example-enterprise

      - name: Bảng quản trị, cổng công khai, trang tài liệu không phụ thuộc gói xã
        run: |
          curl -fsS http://localhost:3001/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:9080/public/rpc/procedure_catalog)" = 404
          test "$(curl -s http://localhost:9080/docs/modules.json)" = "[]"

      - name: Truy cập qua proxy HTTPS (CA nội bộ, chuyển hướng http, Keycloak trong token, đăng nhập bảng quản trị)
        run: |
          make https-ca
          CA="--cacert communeos-https-ca.crt"
          curl -fsS $CA -o /dev/null https://localhost:8444/
          curl -fsS $CA -o /dev/null https://localhost:8445/docs/
          curl -fsS $CA -X POST -H 'Content-Type: application/json' -d '{}' https://localhost:8445/public/rpc/public_platform
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost/)" = "https://localhost/"
          curl -fsS $CA https://localhost:8446/realms/communeos/.well-known/openid-configuration |
            grep -q '"issuer":"https://localhost:8446/realms/communeos"'
          # Đăng nhập bảng quản trị qua HTTPS: đúng Origin thì nhận cookie Secure; Origin lạ bị chặn.
          U=$(sed -n 's/^COMMUNEOS_ADMIN_USERNAME=//p' .env); P=$(sed -n 's/^COMMUNEOS_ADMIN_PASSWORD=//p' .env)
          curl -fsS $CA -D headers.txt -o /dev/null -H 'Origin: https://localhost:8444' -H 'Content-Type: application/json' \
            -d "{\"username\":\"$U\",\"password\":\"$P\"}" https://localhost:8444/api/dang-nhap
          grep -qi '^set-cookie:.*secure' headers.txt
          test "$(curl -s $CA -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' -H 'Content-Type: application/json' \
            -d '{}' https://localhost:8444/api/dang-nhap)" = 403

      - name: In log khi lỗi
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=200 db-setup orchestrator rest gateway accounts identity-setup https || true

  kiem-thu:
    name: Dựng toàn bộ từ mã nguồn và kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tạo .env (make secrets sinh mọi bí mật)
        run: |
          make secrets
          # Kiểm thử trình duyệt chạy qua http trên máy CI (loopback).
          sed -i "s/^PORTAL_ALLOW_LOCAL_HTTP=.*/PORTAL_ALLOW_LOCAL_HTTP=true/" .env
          make check-env

      - name: Kiểm tra cú pháp docker-compose và script
        run: |
          docker compose config -q
          for f in modules/xa/tests/tenant-isolation.sh core/tests/platform.sh core/tests/wait-ready.sh core/identity/check-admin-env.sh core/ops/check-env.sh core/ops/secrets.sh \
                   core/db/migrate.sh core/db/init/*.sh modules/doanh-nghiep/test.sh apps/citizen/e2e/run.sh; do
            sh -n "$f"
          done
          for f in modules/xa/demo/demo.mjs core/accounts/server.mjs core/orchestrator/server.mjs core/files/server.mjs core/ai/server.mjs; do
            node --check "$f"
          done

      # Dựng như người dùng chạy make up, trừ trợ lý AI (tải mô hình khoảng 2,6 GB) và quét mã độc (tùy chọn).
      # Ba ứng dụng Nuxt được build từ mã nguồn ở bước này.
      - name: Dựng lõi và ba ứng dụng từ mã nguồn
        run: >-
          docker compose up -d --build
          db db-setup identity identity-setup rest-keys rest gateway api-docs workflow-engine orchestrator
          storage files accounts citizen commune admin

      - name: Chờ mọi dịch vụ sẵn sàng (healthcheck)
        run: sh core/tests/wait-ready.sh 900

      - name: Tạo dữ liệu mẫu qua API của lõi (xã, lãnh đạo, cán bộ, công dân, hồ sơ)
        run: DEMO_PASSWORD='Demo@2026!' make demo

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kiểm thử kiến trúc và phiên đăng nhập ba kênh
        run: |
          node --experimental-strip-types --test core/tests/architecture.test.mjs
          node modules/xa/tests/portal-smoke.mjs
          npm --prefix apps/commune test

      - name: Kiểm thử qua cổng API (cách ly xã, quy trình, tệp, tài khoản, công dân)
        run: make test

      - name: Lõi dùng chung (đơn vị, gói, sổ ghi nhận, quy trình)
        run: make test-platform

      - name: Gói doanh nghiệp trên cùng lõi (đơn vị Công ty A, quy trình duyệt nghỉ phép)
        run: make example-enterprise

      - name: Kiểm thử SQL (RLS, phân quyền; ROLLBACK)
        run: make test-sql

      - name: Kiểm thử đơn vị Kênh người dân
        run: make test-citizen

      - name: Kiểm thử giao diện Kênh người dân (Playwright)
        run: make e2e-citizen

      - name: Lưu ảnh chụp, trace của kiểm thử giao diện khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ket-qua
          path: apps/citizen/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: In log khi lỗi
        if: failure()
        run: |
          echo '=== Trang thai tat ca containers ==='
          docker compose ps -a || true
          echo '=== PostgreSQL va db-setup ==='
          docker compose logs --no-color --tail=200 db db-setup || true
          echo '=== Cac dich vu loi con lai ==='
          docker compose logs --no-color --tail=60 identity identity-setup rest gateway workflow-engine orchestrator accounts files citizen commune admin || true
