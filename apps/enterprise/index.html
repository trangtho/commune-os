<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CommuneOS Enterprise</title><link rel="stylesheet" href="/style.css"><body><header><h1>CommuneOS Enterprise</h1><p>Quản lý nghỉ phép · Một nền tảng, nhiều nghiệp vụ</p></header><main><p id="notice" role="status"></p><section id="login"><h2>Đăng nhập Keycloak</h2><form id="loginForm"><label>Tài khoản<input name="username" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button>Đăng nhập</button></form></section><div id="workspace" hidden><section><h2 id="who"></h2><button id="logout">Đăng xuất</button></section><section><h2>Đăng ký nghỉ phép</h2><form id="leaveForm"><label>Từ ngày<input type="date" name="from_date" required></label><label>Đến ngày<input type="date" name="to_date" required></label><label>Lý do<textarea name="reason" minlength="3" maxlength="500" required></textarea></label><button>Gửi đơn</button></form></section><section><h2>Danh sách đơn</h2><button id="reload">Làm mới</button><div id="list"></div></section><section><h2>Hỏi quy chế nghỉ phép</h2><form id="askForm"><label>Câu hỏi<input name="question" maxlength="500" required></label><button>Hỏi trợ lý</button></form><pre id="answer"></pre></section></div></main><script type="module" src="/app.js"></script></body></html>
