#
# Các dịch vụ lõi CommuneOS: db, identity, gateway.
# Bổ sung db-setup và citizen cho Kênh Công dân; chỉ mở cổng PostgreSQL và
# Citizen trên localhost, giữ nguyên các cổng phát triển của lõi.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: communeos_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_REST_PASSWORD: ${POSTGRES_REST_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./core/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  identity:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./core/identity/realm:/opt/keycloak/data/import:ro
    depends_on:
      db-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  gateway:
    image: apache/apisix:3.20.0-debian
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./core/gateway/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./core/gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml
    depends_on:
      - identity
      - rest
    ports:
      - "${GATEWAY_PORT}:9080"

  # Bổ sung lược đồ Citizen Portal trên cả PostgreSQL mới và volume hiện có.
  # Không xóa db-data; seed chỉ được nạp bởi db-setup, tránh mount chồng lên init read-only.
  # Script khởi tạo ứng dụng và seed được thiết kế để chạy lại.
  db-setup:
    image: postgres:17
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: communeos_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_REST_PASSWORD: ${POSTGRES_REST_PASSWORD}
    volumes:
      - ./core/db/init:/setup/init:ro
      - ./core/db/seed:/setup/seed:ro
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        echo 'Preparing PostgreSQL app role, schema and seed...'
        # Tạo cơ sở dữ liệu Keycloak cho cả volume Citizen cũ.
        if ! psql -v ON_ERROR_STOP=1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -qx 1; then
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE keycloak"
        fi
        sh /setup/init/00-create-app-role.sh
        psql -v ON_ERROR_STOP=1 -f /setup/init/01-schema.sql
        sh /setup/init/02-create-api-roles.sh
        psql -v ON_ERROR_STOP=1 -f /setup/init/03-api.sql
        psql -v ON_ERROR_STOP=1 -f /setup/seed/seed.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/02-ai-knowledge.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/03-citizen-chat-history.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/04-citizen-personalization.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/05-citizen-representation-counter.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/06-citizen-assistance-family-consultation.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/07-citizen-handoff-support.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/08-api-can-bo.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/09-api-xu-ly-ho-so.sql
        psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS published_procedures FROM procedures WHERE published = true"
        echo 'PostgreSQL setup finished successfully.'

    # Lấy khóa công khai của Keycloak cho PostgREST (chạy 1 lần rồi dừng).
  rest-keys:
    image: node:22-alpine
    restart: "no"
    command: ["node", "/script/fetch-jwks.mjs"]
    volumes:
      - ./core/rest:/script:ro
      - rest-keys:/keys
    depends_on:
      - identity

  # API dữ liệu. Không mở cổng ra ngoài: chỉ đi qua gateway /rest/.
  rest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_REST_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: ""
      PGRST_JWT_SECRET: "@/keys/jwks.json"
      PGRST_JWT_ROLE_CLAIM_KEY: ".azp"
      PGRST_SERVER_PORT: "3000"
    volumes:
      - rest-keys:/keys:ro
    depends_on:
      db-setup:
        condition: service_completed_successfully
      rest-keys:
        condition: service_completed_successfully

  citizen:
    build:
      context: ./apps/citizen
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      CITIZEN_STAFF_BRIDGE_TOKEN: ${CITIZEN_STAFF_BRIDGE_TOKEN:-}
      HOST: 0.0.0.0
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: communeos_app
      PGPASSWORD: ${POSTGRES_APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      DEMO_MODE: ${DEMO_MODE:-true}
      STORAGE_DIR: /app/storage
      # Nuxt runtimeConfig: ghi đè giá trị mặc định lúc chạy container.
      # Chuyển từ docker-compose.override.yml vào cấu hình chính.
      NUXT_DB_HOST: db
      NUXT_DB_PORT: "5432"
      NUXT_DB_NAME: ${POSTGRES_DB}
      NUXT_DB_USER: communeos_app
      NUXT_DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
      NUXT_SESSION_SECRET: ${SESSION_SECRET}
      CITIZEN_OIDC_PROVIDER: ${CITIZEN_OIDC_PROVIDER:-identity}
      CITIZEN_OIDC_RESIDENCE_TENANT_CLAIM: ${CITIZEN_OIDC_RESIDENCE_TENANT_CLAIM:-}
      CITIZEN_OIDC_TEMPORARY_TENANT_CLAIM: ${CITIZEN_OIDC_TEMPORARY_TENANT_CLAIM:-}
      CITIZEN_OIDC_LOCALITY_SCOPE: ${CITIZEN_OIDC_LOCALITY_SCOPE:-}
      CITIZEN_VNEID_INTEGRATION_APPROVED: ${CITIZEN_VNEID_INTEGRATION_APPROVED:-false}
      CITIZEN_OIDC_ISSUER: ${CITIZEN_OIDC_ISSUER:-}
      CITIZEN_OIDC_AUTHORIZE_URL: ${CITIZEN_OIDC_AUTHORIZE_URL:-}
      CITIZEN_OIDC_TOKEN_URL: ${CITIZEN_OIDC_TOKEN_URL:-}
      CITIZEN_OIDC_JWKS_URL: ${CITIZEN_OIDC_JWKS_URL:-}
      CITIZEN_OIDC_CLIENT_ID: ${CITIZEN_OIDC_CLIENT_ID:-}
      CITIZEN_OIDC_CLIENT_SECRET: ${CITIZEN_OIDC_CLIENT_SECRET:-}
      CITIZEN_OIDC_REDIRECT_URI: ${CITIZEN_OIDC_REDIRECT_URI:-}
      NUXT_OIDC_ISSUER: ${CITIZEN_OIDC_ISSUER:-}
      NUXT_OIDC_AUTHORIZE_URL: ${CITIZEN_OIDC_AUTHORIZE_URL:-}
      NUXT_OIDC_TOKEN_URL: ${CITIZEN_OIDC_TOKEN_URL:-}
      NUXT_OIDC_JWKS_URL: ${CITIZEN_OIDC_JWKS_URL:-}
      NUXT_OIDC_CLIENT_ID: ${CITIZEN_OIDC_CLIENT_ID:-}
      NUXT_OIDC_CLIENT_SECRET: ${CITIZEN_OIDC_CLIENT_SECRET:-}
      NUXT_OIDC_REDIRECT_URI: ${CITIZEN_OIDC_REDIRECT_URI:-}
      NUXT_STORAGE_DIR: /app/storage
      # Optional server-side, OpenAI-compatible answer model and legacy classifier.
      # Do not expose tokens via Nuxt public runtimeConfig.
      CITIZEN_AI_ENDPOINT: ${CITIZEN_AI_ENDPOINT:-}
      CITIZEN_AI_MODEL: ${CITIZEN_AI_MODEL:-}
      CITIZEN_AI_TOKEN: ${CITIZEN_AI_TOKEN:-}
      CITIZEN_RAG_ENDPOINT: ${CITIZEN_RAG_ENDPOINT:-}
      CITIZEN_RAG_TOKEN: ${CITIZEN_RAG_TOKEN:-}
      # Nitro runtime overrides (NUXT_* must be available at container runtime).
      NUXT_AI_ENDPOINT: ${CITIZEN_AI_ENDPOINT:-}
      NUXT_AI_MODEL: ${CITIZEN_AI_MODEL:-}
      NUXT_AI_TOKEN: ${CITIZEN_AI_TOKEN:-}
      NUXT_RAG_ENDPOINT: ${CITIZEN_RAG_ENDPOINT:-}
      NUXT_RAG_TOKEN: ${CITIZEN_RAG_TOKEN:-}
    volumes:
      - citizen-uploads:/app/storage
    ports:
      - "127.0.0.1:${CITIZEN_PORT:-3000}:3000"

volumes:
  db-data:
  rest-keys:
  citizen-uploads:
