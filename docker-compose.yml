# Các dịch vụ của lõi CommuneOS. Chỉ dịch vụ gateway mở cổng cho bên ngoài
# (cổng của identity tạm mở trong giai đoạn phát triển).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./core/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./core/identity/realm:/opt/keycloak/data/import:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  gateway:
    image: apache/apisix:3.20.0-debian
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./core/gateway/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./core/gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml
    depends_on:
      - identity
    ports:
      - "${GATEWAY_PORT}:9080"

volumes:
  db-data:
