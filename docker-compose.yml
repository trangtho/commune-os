#
# Các dịch vụ lõi CommuneOS: db, identity, gateway.
# Bổ sung db-setup và citizen cho Kênh Công dân; chỉ mở cổng PostgreSQL và
# Citizen trên localhost, giữ nguyên các cổng phát triển của lõi.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: communeos_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_REST_PASSWORD: ${POSTGRES_REST_PASSWORD}
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN}
    # Do not run app migrations via docker-entrypoint-initdb.d:
    # on a fresh volume, guidance rules reference procedures before seed.sql exists.
    # db-setup owns the ordered schema/seed/migration lifecycle.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  identity:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./core/identity/realm:/opt/keycloak/data/import:ro
    depends_on:
      db-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  gateway:
    image: apache/apisix:3.20.0-debian
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./core/gateway/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./core/gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml
    depends_on:
      - identity
      - rest
    ports:
      - "${GATEWAY_PORT}:9080"

  # Bổ sung lược đồ Citizen Portal trên cả PostgreSQL mới và volume hiện có.
  # Không xóa db-data; seed chỉ được nạp bởi db-setup, tránh mount chồng lên init read-only.
  # Script khởi tạo ứng dụng và seed được thiết kế để chạy lại.
  db-setup:
    image: postgres:17
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: communeos_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_REST_PASSWORD: ${POSTGRES_REST_PASSWORD}
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN}
    volumes:
      - ./core/db/init:/setup/init:ro
      - ./core/db/seed:/setup/seed:ro
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        echo 'Preparing PostgreSQL app role, schema and seed...'
        # Tạo cơ sở dữ liệu Keycloak cho cả volume Citizen cũ.
        if ! psql -v ON_ERROR_STOP=1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -qx 1; then
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE keycloak"
        fi
        # Cơ sở dữ liệu riêng cho động cơ quy trình Flowable.
        if ! psql -v ON_ERROR_STOP=1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'flowable'" | grep -qx 1; then
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE flowable"
        fi
        sh /setup/init/00-create-app-role.sh
        psql -v ON_ERROR_STOP=1 -f /setup/init/01-schema.sql
        sh /setup/init/02-create-api-roles.sh
        psql -v ON_ERROR_STOP=1 -f /setup/init/03-api.sql
        psql -v ON_ERROR_STOP=1 -f /setup/seed/seed.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/02-ai-knowledge.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/03-citizen-chat-history.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/04-citizen-personalization.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/05-citizen-representation-counter.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/06-citizen-assistance-family-consultation.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/07-citizen-handoff-support.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/08-api-can-bo.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/09-api-xu-ly-ho-so.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/10-ledger.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/11-citizen-guidance-batches.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/11-workflow.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/12-citizen-case-review-counter.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/13-citizen-case-actions-delivery-routing.sql
        sh /setup/init/12-workflow-secret.sh
        psql -v ON_ERROR_STOP=1 -f /setup/init/13-thu-tuc-theo-xa.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/14-luu-tru-tep.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/15-citizen-vault-autofill.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/16-citizen-procedure-privacy.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/17-citizen-intelligent-services.sql
        psql -v ON_ERROR_STOP=1 -f /setup/init/18-citizen-life-journeys.sql
        psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS published_procedures FROM procedures WHERE published = true"
        echo 'PostgreSQL setup finished successfully.'

    # Lấy khóa công khai của Keycloak cho PostgREST (chạy 1 lần rồi dừng).
  rest-keys:
    image: node:22-alpine
    restart: "no"
    command: ["node", "/script/fetch-jwks.mjs"]
    volumes:
      - ./core/rest:/script:ro
      - rest-keys:/keys
    depends_on:
      - identity

  # API dữ liệu. Không mở cổng ra ngoài: chỉ đi qua gateway /rest/.
  rest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_REST_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: ""
      PGRST_JWT_SECRET: "@/keys/jwks.json"
      PGRST_JWT_ROLE_CLAIM_KEY: ".azp"
      PGRST_SERVER_PORT: "3000"
    volumes:
      - rest-keys:/keys:ro
    depends_on:
      db-setup:
        condition: service_completed_successfully
      rest-keys:
        condition: service_completed_successfully

    # Động cơ quy trình BPMN (Flowable). Không mở cổng ra ngoài; chỉ dịch vụ điều phối gọi.
  workflow-engine:
    image: flowable/flowable-rest:8.0.0
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flowable
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
    depends_on:
      db-setup:
        condition: service_completed_successfully

  # Dịch vụ điều phối quy trình của lõi: nạp sơ đồ BPMN, kiểm tra bước hợp lệ, ghi trạng thái hồ sơ.
  orchestrator:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    environment:
      FLOWABLE_URL: http://workflow-engine:8080/flowable-rest/service
      FLOWABLE_USER: rest-admin
      FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      REST_URL: http://rest:3000
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN}
    volumes:
      - ./core/orchestrator:/app:ro
    depends_on:
      - workflow-engine
      - rest

      # Kho đối tượng chuẩn S3 cho dữ liệu phi cấu trúc (SeaweedFS, Apache-2.0). Không mở cổng ra ngoài.
  storage:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command: server -dir=/data -s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data

  # Dịch vụ tệp của lõi: kiểm tra, quét mã độc (tùy chọn), lưu vào kho, ghi mã băm.
  files:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: communeos-documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      REST_URL: http://rest:3000
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN}
      FILES_SERVICE_TOKEN: ${FILES_SERVICE_TOKEN}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
    volumes:
      - ./core/files:/app:ro
    depends_on:
      - storage
      - rest

  # Quét mã độc (tùy chọn, cần khoảng 1,5 GB RAM):
  #   docker compose --profile antivirus up -d antivirus   rồi đặt CLAMAV_HOST=antivirus
  antivirus:
    image: clamav/clamav:1.5.2
    profiles: ["antivirus"]
    restart: unless-stopped

  citizen:
    build:
      context: ./apps/citizen
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      CITIZEN_STAFF_BRIDGE_TOKEN: ${CITIZEN_STAFF_BRIDGE_TOKEN:-}
      CITIZEN_GOVERNANCE_TOKEN: ${CITIZEN_GOVERNANCE_TOKEN:-}
      HOST: 0.0.0.0
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: communeos_app
      PGPASSWORD: ${POSTGRES_APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      DEMO_MODE: ${DEMO_MODE:-true}
      CITIZEN_RETENTION_SCAN_ENABLED: ${CITIZEN_RETENTION_SCAN_ENABLED:-false}
      STORAGE_DIR: /app/storage
      # Nuxt runtimeConfig: ghi đè giá trị mặc định lúc chạy container.
      # Chuyển từ docker-compose.override.yml vào cấu hình chính.
      NUXT_DB_HOST: db
      NUXT_DB_PORT: "5432"
      NUXT_DB_NAME: ${POSTGRES_DB}
      NUXT_DB_USER: communeos_app
      NUXT_DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
      NUXT_SESSION_SECRET: ${SESSION_SECRET}
      CITIZEN_OIDC_PROVIDER: ${CITIZEN_OIDC_PROVIDER:-identity}
      CITIZEN_OIDC_RESIDENCE_TENANT_CLAIM: ${CITIZEN_OIDC_RESIDENCE_TENANT_CLAIM:-}
      CITIZEN_OIDC_TEMPORARY_TENANT_CLAIM: ${CITIZEN_OIDC_TEMPORARY_TENANT_CLAIM:-}
      CITIZEN_OIDC_LOCALITY_SCOPE: ${CITIZEN_OIDC_LOCALITY_SCOPE:-}
      CITIZEN_PUBLIC_ORIGIN: ${CITIZEN_PUBLIC_ORIGIN:-}
      # Dịch vụ kết quả điện tử (tùy chọn); token chỉ dùng phía máy chủ.
      CITIZEN_RESULTS_ENDPOINT: ${CITIZEN_RESULTS_ENDPOINT:-}
      CITIZEN_RESULTS_TOKEN: ${CITIZEN_RESULTS_TOKEN:-}
      # Nitro runtimeConfig: bảo đảm cấu hình khả dụng khi chạy container.
      NUXT_RESULT_ENDPOINT: ${CITIZEN_RESULTS_ENDPOINT:-}
      NUXT_RESULT_TOKEN: ${CITIZEN_RESULTS_TOKEN:-}
      CITIZEN_OCR_ENDPOINT: ${CITIZEN_OCR_ENDPOINT:-}
      CITIZEN_REMINDERS_ENABLED: ${CITIZEN_REMINDERS_ENABLED:-false}
      CITIZEN_OCR_TOKEN: ${CITIZEN_OCR_TOKEN:-}
      # Disabled by default: only for authorized OIDC attribute contracts + explicit opt-in.
      CITIZEN_OIDC_PERSONAL_DATA_APPROVED: ${CITIZEN_OIDC_PERSONAL_DATA_APPROVED:-false}
      CITIZEN_OIDC_PERSONAL_DATA_SCOPE: ${CITIZEN_OIDC_PERSONAL_DATA_SCOPE:-}
      CITIZEN_OIDC_NAME_CLAIM: ${CITIZEN_OIDC_NAME_CLAIM:-}
      CITIZEN_OIDC_BIRTH_DATE_CLAIM: ${CITIZEN_OIDC_BIRTH_DATE_CLAIM:-}
      CITIZEN_OIDC_IDENTIFIER_CLAIM: ${CITIZEN_OIDC_IDENTIFIER_CLAIM:-}
      CITIZEN_OIDC_PHONE_CLAIM: ${CITIZEN_OIDC_PHONE_CLAIM:-}
      CITIZEN_OIDC_ADDRESS_CLAIM: ${CITIZEN_OIDC_ADDRESS_CLAIM:-}
      CITIZEN_VNEID_INTEGRATION_APPROVED: ${CITIZEN_VNEID_INTEGRATION_APPROVED:-false}
      CITIZEN_OIDC_ISSUER: ${CITIZEN_OIDC_ISSUER:-}
      CITIZEN_OIDC_AUTHORIZE_URL: ${CITIZEN_OIDC_AUTHORIZE_URL:-}
      CITIZEN_OIDC_TOKEN_URL: ${CITIZEN_OIDC_TOKEN_URL:-}
      CITIZEN_OIDC_JWKS_URL: ${CITIZEN_OIDC_JWKS_URL:-}
      CITIZEN_OIDC_CLIENT_ID: ${CITIZEN_OIDC_CLIENT_ID:-}
      CITIZEN_OIDC_CLIENT_SECRET: ${CITIZEN_OIDC_CLIENT_SECRET:-}
      CITIZEN_OIDC_REDIRECT_URI: ${CITIZEN_OIDC_REDIRECT_URI:-}
      NUXT_OIDC_ISSUER: ${CITIZEN_OIDC_ISSUER:-}
      NUXT_OIDC_AUTHORIZE_URL: ${CITIZEN_OIDC_AUTHORIZE_URL:-}
      NUXT_OIDC_TOKEN_URL: ${CITIZEN_OIDC_TOKEN_URL:-}
      NUXT_OIDC_JWKS_URL: ${CITIZEN_OIDC_JWKS_URL:-}
      NUXT_OIDC_CLIENT_ID: ${CITIZEN_OIDC_CLIENT_ID:-}
      NUXT_OIDC_CLIENT_SECRET: ${CITIZEN_OIDC_CLIENT_SECRET:-}
      NUXT_OIDC_REDIRECT_URI: ${CITIZEN_OIDC_REDIRECT_URI:-}
      NUXT_STORAGE_DIR: /app/storage
      NUXT_FILES_URL: http://files:3000
      NUXT_FILES_SERVICE_TOKEN: ${FILES_SERVICE_TOKEN}
      # Optional server-side, OpenAI-compatible answer model and legacy classifier.
      # Do not expose tokens via Nuxt public runtimeConfig.
      CITIZEN_AI_ENDPOINT: ${CITIZEN_AI_ENDPOINT:-}
      CITIZEN_AI_MODEL: ${CITIZEN_AI_MODEL:-}
      CITIZEN_AI_TOKEN: ${CITIZEN_AI_TOKEN:-}
      CITIZEN_RAG_ENDPOINT: ${CITIZEN_RAG_ENDPOINT:-}
      CITIZEN_RAG_TOKEN: ${CITIZEN_RAG_TOKEN:-}
      # Nitro runtime overrides (NUXT_* must be available at container runtime).
      NUXT_AI_ENDPOINT: ${CITIZEN_AI_ENDPOINT:-}
      NUXT_AI_MODEL: ${CITIZEN_AI_MODEL:-}
      NUXT_AI_TOKEN: ${CITIZEN_AI_TOKEN:-}
      NUXT_RAG_ENDPOINT: ${CITIZEN_RAG_ENDPOINT:-}
      NUXT_RAG_TOKEN: ${CITIZEN_RAG_TOKEN:-}
    volumes:
      - citizen-uploads:/app/storage
    ports:
      - "127.0.0.1:${CITIZEN_PORT:-3000}:3000"

  # Màn hình cán bộ xã (Tầng 2). Đăng nhập qua Keycloak, đọc/ghi qua cổng APISIX.
  commune:
    build:
      context: ./apps/commune
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway
      - identity
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Biến NUXT_* ghi đè runtimeConfig lúc chạy container.
      NUXT_SESSION_SECRET: ${SESSION_SECRET}
      NUXT_KEYCLOAK_URL: http://identity:8080
      NUXT_GATEWAY_URL: http://gateway:9080
    ports:
      - "127.0.0.1:${COMMUNE_PORT:-3002}:3000"

  # Bảng quản trị hệ thống (Tầng 2, gọi lõi qua cổng API). Chỉ tài khoản có vai trò sys_admin đăng nhập được.
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway
      - identity
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_KEYCLOAK_URL: http://identity:8080
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3000"

volumes:
  db-data:
  rest-keys:
  citizen-uploads:
  storage-data:
