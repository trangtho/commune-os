          maxLength: 255
          minLength: 2
          title: Applicant
        procedure_code:
          type: string
          title: Procedure Code
        slot:
          type: string
          format: date-time
          title: Slot
      type: object
      required:
      - applicant
      - procedure_code
      - slot
      title: AppointmentInput
    Body_add_document_api_dossiers__dossier_id__documents_post:
      properties:
        doc_type:
          type: string
          title: Doc Type
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - doc_type
      - file
      title: Body_add_document_api_dossiers__dossier_id__documents_post
    Body_admin_packs_api_admin_packs_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_admin_packs_api_admin_packs_post
    Body_create_dossier_api_dossiers_post:
      properties:
        data:
          type: string
          title: Data
        files:
          items:
            type: string
            format: binary
          type: array
          title: Files
          default: []
        doc_types:
          items:
            type: string
          type: array
          title: Doc Types
          default: []
      type: object
      required:
      - data
      title: Body_create_dossier_api_dossiers_post
    ChangeInput:
      properties:
        action:
          type: string
          title: Action
        reason:
          type: string
          title: Reason
          default: ''
      type: object
      required:
      - action
      title: ChangeInput
    FeedbackInput:
      properties:
        rating:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Rating
        comment:
          type: string
          maxLength: 2000
          title: Comment
          default: ''
      type: object
      required:
      - rating
      title: FeedbackInput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginInput:
      properties:
        role:
          type: string
          title: Role
      type: object
      required:
      - role
      title: LoginInput
    PrecheckInput:
      properties:
        procedure_code:
          type: string
          title: Procedure Code
        document_types:
          items:
            type: string
          type: array
          title: Document Types
        form_data:
          additionalProperties: true
          type: object
          title: Form Data
      type: object
      required:
      - procedure_code
      title: PrecheckInput
    TenantInput:
      properties:
        code:
          type: string
          maxLength: 50
          minLength: 2
          pattern: ^[a-z0-9-]+$
          title: Code
        name:
          type: string
          maxLength: 255
          minLength: 2
          title: Name
      type: object
      required:
      - code
      - name
      title: TenantInput
    TenantStatus:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: TenantStatus
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
